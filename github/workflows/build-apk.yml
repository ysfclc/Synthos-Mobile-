name: Build SynthOS Pocket APK

on:
push:
pull_request:
workflow_dispatch:

permissions:
contents: read

concurrency:
group: synthos-build-${{ github.ref }}
cancel-in-progress: true

jobs:
build:
name: Test and build APK
runs-on: ubuntu-latest
timeout-minutes: 35

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Verify project ZIP exists
    run: |
      test -f synthos-pocket-v1.0.0.zip || {
        echo "::error::Missing synthos-pocket-v1.0.0.zip in repository root"
        exit 1
      }

  - name: Extract Android project
    run: |
      mkdir -p "$RUNNER_TEMP/synthos-src"
      unzip -q synthos-pocket-v1.0.0.zip \
        -d "$RUNNER_TEMP/synthos-src"

      PROJECT_DIR="$RUNNER_TEMP/synthos-src/synthos-pocket-v1.0.0"

      test -f "$PROJECT_DIR/settings.gradle.kts"
      test -f "$PROJECT_DIR/app/build.gradle.kts"

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android build tools
    run: |
      sdkmanager --install \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "platform-tools"

  - name: Set up
