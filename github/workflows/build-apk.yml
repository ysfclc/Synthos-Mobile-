name: Build SynthOS Pocket APK

'on':
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthos-pocket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for project ZIP
        id: zip_check
        shell: bash
        run: |
          ZIP_NAME="synthos-pocket-v1.0.0.zip"
          if [[ -f "$ZIP_NAME" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Found $ZIP_NAME"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No $ZIP_NAME found in the repository root yet. Upload it as the next commit to trigger the build."
          fi

      - name: Set up JDK 17
        if: steps.zip_check.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.zip_check.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        if: steps.zip_check.outputs.present == 'true'
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        if: steps.zip_check.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Extract ZIP and locate Android project
        if: steps.zip_check.outputs.present == 'true'
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/synthos-extracted"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "synthos-pocket-v1.0.0.zip" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -maxdepth 5 -type f -name 'settings.gradle.kts' -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::The ZIP does not contain settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          for required in app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [[ ! -f "$PROJECT_DIR/$required" ]]; then
              echo "::error::Missing required project file: $required"
              exit 1
            fi
          done

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Run unit tests and Android lint
        if: steps.zip_check.outputs.present == 'true'
        env:
          PROJECT_DIR: ${{ steps.locate_project.outputs.project_dir }}
        run: gradle --no-daemon -p "$PROJECT_DIR" testDebugUnitTest lintDebug --stacktrace

      - name: Assemble installable debug APK
        if: steps.zip_check.outputs.present == 'true'
        env:
          PROJECT_DIR: ${{ steps.locate_project.outputs.project_dir }}
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload installable APK
        if: steps.zip_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synthos-pocket-debug-apk
          path: ${{ steps.locate_project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
