
name: Build SynthOS Android APK

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK from source ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No source ZIP yet; upload one to trigger the build."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP_FILE"

      - name: Set up JDK 17
        if: steps.source.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.source.outputs.found == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: steps.source.outputs.found == 'true'
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract and validate project
        if: steps.source.outputs.found == 'true'
        id: project
        shell: bash
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.zip_file }}
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/synthos-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -maxdepth 6 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::No Gradle settings file found inside the ZIP."
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          [[ -f "$PROJECT_DIR/app/build.gradle.kts" || -f "$PROJECT_DIR/app/build.gradle" ]] || { echo "::error::Missing app Gradle build file"; exit 1; }
          [[ -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]] || { echo "::error::Missing AndroidManifest.xml"; exit 1; }

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      - name: Run unit tests
        if: steps.source.outputs.found == 'true'
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: "$PROJECT_DIR/gradlew" --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        if: steps.source.outputs.found == 'true'
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: "$PROJECT_DIR/gradlew" --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        if: steps.source.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synthos-android-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
