
name: Build SynthOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'synthos-pocket.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find Android SDK manager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify source ZIP
        run: test -f synthos-pocket.zip

      - name: Extract source code
        run: unzip -o synthos-pocket.zip

      - name: Enable AndroidX
        run: |
          grep -qxF 'android.useAndroidX=true' synthos-pocket/gradle.properties || \
            echo 'android.useAndroidX=true' >> synthos-pocket/gradle.properties

      - name: Verify project files
        run: |
          set -e
          test -f synthos-pocket/settings.gradle.kts
          test -f synthos-pocket/build.gradle.kts
          test -f synthos-pocket/app/build.gradle.kts
          test -f synthos-pocket/app/src/main/AndroidManifest.xml
          echo "SynthOS Android project files found."

      - name: Test, lint, and build APK
        working-directory: synthos-pocket
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: synthos-pocket-debug-apk
          path: synthos-pocket/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
