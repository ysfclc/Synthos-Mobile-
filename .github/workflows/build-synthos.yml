name: Build SynthOS Android APK

on:
push:
pull_request:
workflow_dispatch:

permissions:
contents: read

concurrency:
group: synthos-android-${{ github.workflow }}-${{ github.ref }}
cancel-in-progress: true

jobs:
build:
name: Verify, test and build APK
runs-on: ubuntu-latest
timeout-minutes: 40

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify source ZIP exists
    shell: bash
    run: |
      set -euo pipefail
      if [ ! -f synthos-pocket.zip ]; then
        echo "::error::Missing synthos-pocket.zip in repository root."
        exit 1
      fi

  - name: Verify ZIP integrity
    shell: bash
    run: |
      set -euo pipefail
      unzip -t synthos-pocket.zip

  - name: Verify SHA-256 when sidecar exists
    shell: bash
    run: |
      set -euo pipefail

      if [ -f synthos-pocket.zip.sha256 ]; then
        expected="$(awk 'NR==1 {print $1}' synthos-pocket.zip.sha256)"
        actual="$(sha256sum synthos-pocket.zip | awk '{print $1}')"

        if [ "$expected" != "$actual" ]; then
          echo "::error::SHA-256 mismatch for synthos-pocket.zip"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          exit 1
        fi

        echo "SHA-256 verified: $actual"
      else
        echo "::notice::Checksum sidecar not found; ZIP integrity was checked."
      fi

  - name: Extract project
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p extracted
      unzip -q synthos-pocket.zip -d extracted

      if [ -f extracted/synthos-pocket/settings.gradle.kts ]; then
        PROJECT_DIR="extracted/synthos-pocket"
      elif [ -f extracted/settings.gradle.kts ]; then
        PROJECT_DIR="extracted"
      else
        echo "::error::Could not find settings.gradle.kts after extraction."
        find extracted -maxdepth 4 -type f | head -100
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project directory: $PROJECT_DIR"

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Validate Gradle wrapper
    shell: bash
    working-directory: ${{ env.PROJECT_DIR }}
    run: |
      set -euo pipefail
      test -f gradlew || {
        echo "::error::Gradle wrapper script is missing."
        exit 1
      }
      test -f gradle/wrapper/gradle-wrapper.properties || {
        echo "::error::Gradle wrapper properties are missing."
        exit 1
      }
      chmod +x gradlew

  - name: Run unit tests
    shell: bash
    working-directory: ${{ env.PROJECT_DIR }}
    run: ./gradlew --no-daemon testDebugUnitTest

  - name: Run Android lint
    shell: bash
    working-directory: ${{ env.PROJECT_DIR }}
    run: ./gradlew --no-daemon lintDebug

  - name: Assemble debug APK
    shell: bash
    working-directory: ${{ env.PROJECT_DIR }}
    run: ./gradlew --no-daemon assembleDebug

  - name: Upload test and lint reports
    if: always() && env.PROJECT_DIR != ''
    uses: actions/upload-artifact@v4
    with:
      name: synthos-build-reports
      if-no-files-found: ignore
      path: |
        ${{ env.PROJECT_DIR }}/app/build/reports/tests/
        ${{ env.PROJECT_DIR }}/app/build/reports/lint-results*
        ${{ env.PROJECT_DIR }}/app/build/test-results/

  - name: Upload debug APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: synthos-pocket-debug-apk
      if-no-files-found: error
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      retention-days: 14
