name: Build SynthOS Android APK

'on':
push:
pull_request:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build SynthOS APK
runs-on: ubuntu-latest
timeout-minutes: 40

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Check source ZIP
    shell: bash
    run: |
      set -euo pipefail
      test -f synthos-pocket.zip || {
        echo "::error::synthos-pocket.zip must be in the repository root."
        exit 1
      }
      unzip -t synthos-pocket.zip

  - name: Extract project
    shell: bash
    run: |
      set -euo pipefail
      mkdir -p extracted
      unzip -q synthos-pocket.zip -d extracted

      if [ -f extracted/synthos-pocket/settings.gradle.kts ]; then
        echo "PROJECT_DIR=extracted/synthos-pocket" >> "$GITHUB_ENV"
      elif [ -f extracted/settings.gradle.kts ]; then
        echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
      else
        echo "::error::settings.gradle.kts not found in the ZIP."
        find extracted -maxdepth 4 -type f | head -100
        exit 1
      fi

  - name: Validate Gradle wrapper
    shell: bash
    working-directory: ${{ env.PROJECT_DIR }}
    run: |
      set -euo pipefail
      test -f gradlew
      test -f gradle/wrapper/gradle-wrapper.properties
      chmod +x gradlew

  - name: Run tests, lint and build APK
    shell: bash
    working-directory: ${{ env.PROJECT_DIR }}
    run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  - name: Upload debug APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: synthos-pocket-debug-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
